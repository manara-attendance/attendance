<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al-Manara Attendance — Printable QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --night:#0E2A47; --lamp:#F2B705; --ink:#1B2B3A; --muted:#5E7184; }
  body { margin:0; background:#F4F7FA; color:var(--ink);
    font-family:'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', Arial, sans-serif; }
  .bar { max-width:720px; margin:20px auto 0; display:flex; justify-content:flex-end; gap:10px; padding:0 16px; }
  button { font:inherit; font-size:16px; font-weight:600; padding:10px 18px; border:0; border-radius:8px;
           background:var(--night); color:#fff; cursor:pointer; }
  .sheet { max-width:720px; margin:16px auto 40px; background:#fff; padding:48px 40px; text-align:center;
           box-shadow:0 2px 14px rgba(0,0,0,.08); }
  .brand { font-weight:600; font-size:20px; color:var(--night); letter-spacing:.5px; }
  .brand span { color:#B8860B; }
  h1 { font-size:40px; margin:12px 0 28px; }
  #qr { display:inline-block; padding:16px; border:3px solid var(--night); border-radius:8px; line-height:0; }
  .how { margin-top:28px; font-size:20px; line-height:1.5; }
  .how .ar { direction:rtl; color:var(--muted); font-size:22px; }
  .foot { margin-top:26px; font-size:12px; color:var(--muted); }
  @media print {
    @page { size:A4; margin:12mm; }
    body { background:#fff; }
    .bar { display:none; }
    .sheet { box-shadow:none; margin:0 auto; }
  }
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Print</button></div>
<div class="sheet">
  <div class="brand">Al-Manara <span>Attendance</span></div>
  <h1 id="name"></h1>
  <div id="qr"></div>
  <div class="how">
    <div>Scan with your phone camera and tap the link.</div>
    <div class="ar">امسح الكود بكاميرا الموبايل واضغط على الرابط</div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const url = Q.get('u') || '';
document.getElementById('name').textContent = Q.get('name') || '';
if (!/^https:\/\//.test(url)) {
  document.getElementById('qr').textContent = 'Open this page from the Attendance menu (Print static QR).';
} else {
  new QRCode(document.getElementById('qr'), { text: url, width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('foot').textContent = 'Printed ' + new Date().toLocaleDateString('en-GB');
}
if (location.search) history.replaceState(null, '', location.pathname);   // don't keep the code in the address bar
</script>
</body>
</html>
